spring.application.name=PortfolioBackendApp


spring.datasource.url=jdbc:postgresql://localhost:6472/portfolio
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.secret-key=creator-secret-129098

app.admin.username=admin
app.admin.password=admin
app.admin.role=ADMIN

#Swagger Configuration
springdoc.swagger-ui.default-models-expand-depth=-1
